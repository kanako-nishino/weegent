<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Service modal QA</title>
  <style>html,body{margin:0;overflow:hidden}iframe{width:390px;height:844px;margin:0;border:0;overflow:hidden}</style>
</head>
<body>
  <iframe src="./index.html?service-modal-qa=1" onload="
    window.setTimeout(() => {
      const doc = this.contentDocument;
      doc.querySelectorAll('.js-service-modal-open')[8].click();
      window.setTimeout(() => {
        const modal = doc.querySelector('.js-service-modal');
        document.body.dataset.modalOpen = String(modal.classList.contains('is-open'));
        document.body.dataset.modalHidden = String(modal.hidden);
        document.body.dataset.modalTitle = doc.querySelector('.js-service-modal-title').textContent;
        document.body.dataset.modalIcon = doc.querySelector('.js-service-modal-icon').getAttribute('src');
        document.body.dataset.modalSections = String(doc.querySelectorAll('.js-service-modal-body section').length);
        const dialog = doc.querySelector('.service-modal__dialog');
        const rect = dialog.getBoundingClientRect();
        document.body.dataset.frameWidth = String(this.contentWindow.innerWidth);
        document.body.dataset.documentWidth = String(doc.documentElement.scrollWidth);
        document.body.dataset.dialogLeft = String(Math.round(rect.left));
        document.body.dataset.dialogRight = String(Math.round(rect.right));
        document.body.dataset.dialogTop = String(Math.round(rect.top));
        document.body.dataset.dialogBottom = String(Math.round(rect.bottom));
        document.body.dataset.dialogWidth = String(Math.round(rect.width));
        document.body.dataset.dialogScrollTop = String(dialog.scrollTop);
      }, 300);
    }, 800)
  "></iframe>
</body>
</html>
